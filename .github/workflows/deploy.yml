name: Deploy to Railway

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: railway-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build check and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Fail here rather than on Railway: a broken build should not take the
      # running site down while it retries.
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

      - name: Deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          npm i -g @railway/cli@5
          railway up --service "${{ vars.RAILWAY_SERVICE || 'desapego' }}" --ci
